<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Loja Dev</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            margin: 0;
        }

        header {
            background: #020617;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 12px;
        }

        .produtos {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            width: 280px;
        }


        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #login-screen input {
            width: 250px;
            padding: 12px;
            margin: 10px;
            border: none;
            border-radius: 8px;
        }

        #erro {
            color: red;
        }

        .status {
            background: #111827;
            padding: 10px;
            text-align: center;
        }

        input {
            width: 100%;
            max-width: 300px;

            padding: 12px;
            margin-top: 10px;

            border-radius: 8px;
            border: none;
        }


        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1e293b;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 10px;
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>

</head>

<body>

    <div class="modal" id="modal-checkout">
        <div class="modal-content">
            <h2>💳 Checkout</h2>
            <input id="nome" placeholder="Nome completo">
            <input id="endereco" placeholder="Endereço">
            <input id="cartao" placeholder="Número do cartão">
            <input id="cupom" placeholder="Cupom">
            <button onclick="finalizarPedido()">
                Comprar Agora
            </button>
            <button onclick="fecharCheckout()">
                Cancelar
            </button>
        </div>
    </div>

    <div class="modal" id="modal-carrinho" style="display: none;">

        <div class="modal-content">

            <h2>🛒 Seu Carrinho</h2>

            <div id="lista-carrinho"></div>

            <h3 id="total"></h3>

            <button onclick="abrirCheckout()">
                Finalizar Compra
            </button>

            <button onclick="fecharCarrinho()">
                Fechar
            </button>

        </div>

    </div>

    <div id="login-screen">

        <h2>🔐 Login</h2>

        <input id="email" placeholder="Email">

        <input id="senha" type="password" placeholder="Senha">

        <button onclick="fazerLogin()">
            Entrar
        </button>

        <p id="erro"></p>

    </div>

    <div id="app" style="display:none;">

        <header>
            <h1>🛒 Loja Dev</h1>

            <div>

                <button onclick="abrirCarrinho()">
                    Carrinho
                    (<span id="qtd-carrinho">0</span>)
                </button>

                <button onclick="logout()">
                    Logout
                </button>
            </div>

        </header>

        <div class="status" id="status"></div>

        <div style="padding:20px;">
            <input placeholder="Buscar produto" oninput="buscar(this.value)">

        </div>
        <main>
            <div class="produtos" id="produtos"></div>
        </main>

    </div>

</body>

</html>

<script>

    let usuarios = [
        {
            email: "admin@dev.com",
            senha: "admin",
            role: "admin",
            plano: "free",
            bloqueado: false
        },
    ];

    let estado = {

        pedidos: [],

        usuario: {
            email: "admin@dev.com",
            senha: "123",
            role: "admin",
            plano: "free",
            bloqueado: false
        },

        busca: "",
        produtos: [

            {
                id: 1,
                nome: "Notebook Gamer",
                preco: 3000
            },

            {
                id: 2,
                nome: "Mouse RGB",
                preco: 150
            },

            {
                id: 3,
                nome: "Teclado Mecânico",
                preco: 450
            }

        ],
        carrinho: []

    }

    function renderProdutos() {

        let container = document.getElementById("produtos");
        console.log(container)

        let lista = estado.produtos.filter(produto =>
            produto.nome
                .toLowerCase()
                .includes(
                    estado.busca.toLowerCase()
                )
        )
        container.innerHTML = "";

        lista.forEach(produto => {
            container.innerHTML += `
                <div class="card">
                    <img src="">
                    <h2>${produto.nome}</h2>
                    <p>Preço: R$ ${produto.preco}</p>
                    <button onclick="adicionarCarrinho(${produto.id})">Comprar</button>
                </div>
                    `;
        });
    }


    function adicionarCarrinho(id) {

        // procura produto na lista
        let produto =
            estado.produtos.find(
                produto => produto.id === id
            )

        // procura produto no carrinho
        let produtoCarrinho =
            estado.carrinho.find(
                produto => produto.id === id
            )

        // se NÃO existe no carrinho
        if (!produtoCarrinho) {

            estado.carrinho.push({
                ...produto,
                quantidade: 1
            })

        } else {
            // se já existe
            produtoCarrinho.quantidade++
        }

        renderCarrinho()
    }

    function renderCarrinho() {
        let quantidade = estado.carrinho.length
        console.log("carrinho", quantidade)
        document.getElementById("qtd-carrinho").innerText = quantidade

        let container = document.getElementById("lista-carrinho")
        container.innerHTML = "";
        estado.carrinho.forEach(item => {
            container.innerHTML += `
                    <div style="margin-bottom:10px;">
                        ${item.nome} x ${item.quantidade}
                        <button onclick="removerCarrinho(${item.id})"> X </button>
                    </div>
                `;
        });

        document.getElementById("total")
            .innerText =
            "Total: R$ " +
            totalCarrinho().toFixed(2)
    }

    function render() {

        document.getElementById("status").innerText = acesso(estado.usuario);

        renderProdutos()
        renderCarrinho();
    }
    render()

    function fazerLogin() {

        let email = document.getElementById("email").value;
        let senha = document.getElementById("senha").value;

        let usuario = usuarios.find(u =>
            u.email === email &&
            u.senha === senha
        )

        if (!usuario) {
            document.getElementById("erro").innerText = "Login inválido"
            return
        }

        estado.usuario = {
            ...usuario,
            logado: true
        }

        document.getElementById("login-screen").style.display = "none";
        document.getElementById("app").style.display = "block";

        render();

    }

    function acesso(usuario) {
        if (!usuario || !usuario.logado) {
            return "Faça login"
        }

        if (usuario.bloqueado) {
            return "Conta bloqueada"
        }

        if (usuario.role === "admin") {
            return "Acesso total"
        }

        if (usuario.plano === "premium") {
            return "Acesso premium"
        }
        return "Acesso básico"
    }

    function logout() {
        estado.usuario = null
        document.getElementById("app").style.display = "none"
        document.getElementById("login-screen").style.display = "flex"
    }

    function buscar(valor) {
        estado.busca = valor
        render();
    }

    function abrirCarrinho() {

        document.getElementById("modal-carrinho").style.display = "flex"

    }

    function fecharCarrinho() {

        document.getElementById("modal-carrinho").style.display = "none"

    }

    function removerCarrinho(id) {

        estado.carrinho = estado.carrinho.filter(item => item.id !== id)
        render()

    }


    function totalCarrinho() {
        let total = 0

        // Soma produtos
        estado.carrinho.forEach(item => {
            total += item.preco * item.quantidade
        })

        return total;

    }

    function calcularTotal(valor) {
        let desconto = 0
        let cupom = document.getElementById("cupom").value
        if (cupom === "DEV10") {
            cupomAtivo = true
        }

        let vip = estado.usuario.plano === "premium";

        if (vip) {
            desconto += 10
        }

        if (valor > 200) {
            desconto += 15
        }

        if (cupom) {
            desconto += 5
        }

        if (desconto > 25) {
            desconto = 25
        }

        return valor - (valor * desconto / 100)

    }


    function abrirCheckout() {

        if (estado.carrinho.length === 0) {
            alert("Carrinho vazio")
            return
        }

        fecharCarrinho()

        document.getElementById("modal-checkout").style.display = "flex"
    }

    function fecharCheckout() {

        document.getElementById("modal-checkout").style.display = "none"

    }


    function finalizarPedido() {
        let nome = document.getElementById("nome").value;
        let endereco = document.getElementById("endereco").value;
        let cartao = document.getElementById("cartao").value;
        if (!nome || !endereco || !cartao) {
            alert("Preencha todos os campos");
            return
        }

        // dar baixa no estoque de produtos
        estado.carrinho.forEach(item => {
            let produto =
                estado.produtos.find(
                    produto => produto.id === item.id
                )
            produto.estoque -= item.quantidade
        })

        let valorTotalCarrinho = totalCarrinho();
        let valorFinalDesconto = calcularTotal(valorTotalCarrinho);

        estado.pedidos.push({
            itens: estado.carrinho,
            total: valorFinalDesconto,
            data: new Date()
        })
        limparCarrinho();
        alert("Pedido realizado, total R$ " + valorFinalDesconto)
        console.log("PEDIDO", estado.pedidos)
    }

    function limparCarrinho() {
        estado.carrinho = [];
        document.getElementById("nome").value = "";
        document.getElementById("endereco").value = "";
        document.getElementById("cartao").value = "";
        document.getElementById("cupom").value = "";
        fecharCheckout()
        render()
    }

</script>
