<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Dev</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
        }

        /* =========================
           LOGIN
        ========================= */

        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 12px;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #020617;
        }

        /* =========================
           INPUTS
        ========================= */

        input {
            width: 100%;
            max-width: 300px;

            padding: 12px;
            margin-top: 10px;

            border-radius: 8px;
            border: none;
        }

        /* =========================
           BUTTONS
        ========================= */

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 12px;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            background: #111827;
            padding: 10px;
            text-align: center;
        }

        /* =========================
           PRODUTOS
        ========================= */

        .produtos {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 15px;

            padding: 20px;
        }

        .card {
            background: #1e293b;

            padding: 15px;

            border-radius: 10px;
        }

        .card button {
            width: 100%;
            margin-top: 10px;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.8);

            display: none;

            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1e293b;

            width: 90%;
            max-width: 400px;

            padding: 20px;

            border-radius: 10px;

            max-height: 90vh;

            overflow-y: auto;
        }

        /* =========================
           MOBILE
        ========================= */

        @media(max-width:600px) {

            header {
                flex-direction: column;
                gap: 10px;
            }

        }
    </style>
</head>

<body>

    <!-- =========================
         LOGIN
    ========================= -->

    <div id="login-screen">

        <h1>🔐 Login</h1>

        <input
            id="email"
            placeholder="Digite seu email">

        <input
            id="senha"
            type="password"
            placeholder="Digite sua senha">

        <button onclick="fazerLogin()">
            Entrar
        </button>

        <p id="erro" style="color:red;"></p>

    </div>

    <!-- =========================
         APP
    ========================= -->

    <div id="app" style="display:none;">

        <header>

            <h2>🛒 Loja Dev</h2>

            <div>
                <button onclick="abrirCarrinho()">
                    Carrinho
                    (<span id="qtd-carrinho">0</span>)
                </button>

                <button onclick="logout()">
                    Logout
                </button>
            </div>

        </header>

        <div class="status" id="status"></div>

        <main>

            <div style="padding:20px;">

                <input
                    placeholder="Buscar produto"
                    oninput="buscar(this.value)">

            </div>

            <div class="produtos" id="produtos"></div>

        </main>

    </div>

    <!-- =========================
         MODAL CARRINHO
    ========================= -->

    <div class="modal" id="modal-carrinho">

        <div class="modal-content">

            <h2>🛒 Seu Carrinho</h2>

            <div id="lista-carrinho"></div>

            <h3 id="total"></h3>

            <button onclick="abrirCheckout()">
                Finalizar Compra
            </button>

            <button onclick="fecharCarrinho()">
                Fechar
            </button>

        </div>

    </div>

    <!-- =========================
         MODAL CHECKOUT
    ========================= -->

    <div class="modal" id="modal-checkout">

        <div class="modal-content">

            <h2>💳 Checkout</h2>

            <input
                id="nome"
                placeholder="Nome completo">

            <input
                id="endereco"
                placeholder="Endereço">

            <input
                id="cartao"
                placeholder="Número do cartão">

            <input
                id="cupom"
                placeholder="Cupom">

            <button onclick="finalizarPedido()">
                Comprar Agora
            </button>

            <button onclick="fecharCheckout()">
                Cancelar
            </button>

        </div>

    </div>

    <script>

        // =========================
        // ESTADO
        // =========================

        let usuarios = [

            {
                email: "admin@dev.com",
                senha: "123",
                role: "admin",
                plano: "premium",
                bloqueado: false
            },

            {
                email: "user@dev.com",
                senha: "123",
                role: "user",
                plano: "free",
                bloqueado: false
            }

        ]

        let estado = {

            usuario: null,

            busca: "",

            produtos: [

                {
                    id: 1,
                    nome: "Notebook Gamer",
                    preco: 3000,
                    estoque: 5
                },

                {
                    id: 2,
                    nome: "Mouse RGB",
                    preco: 150,
                    estoque: 10
                },

                {
                    id: 3,
                    nome: "Teclado Mecânico",
                    preco: 350,
                    estoque: 7
                }

            ],

            carrinho: [],

            pedidos: [],

            historico: []

        }

        // =========================
        // LOGIN
        // =========================

        function iniciarApp() {

            document.getElementById("login-screen")
                .style.display = "none"

            document.getElementById("app")
                .style.display = "block"

            render()

        }

        function fazerLogin() {

            let email = document.getElementById("email").value

            let senha = document.getElementById("senha").value

            let usuarioEncontrado = null

            for (let i = 0; i < usuarios.length; i++) {

                if (
                    usuarios[i].email === email &&
                    usuarios[i].senha === senha
                ) {

                    usuarioEncontrado = usuarios[i]

                }

            }

            if (!usuarioEncontrado) {

                document.getElementById("erro")
                    .innerText = "Login inválido"

                return

            }

            estado.usuario = {

                email: usuarioEncontrado.email,

                role: usuarioEncontrado.role,

                plano: usuarioEncontrado.plano,

                bloqueado:
                    usuarioEncontrado.bloqueado,

                logado: true

            }

            iniciarApp()

        }

        function logout() {

            estado.usuario = null

            estado.carrinho = []

            document.getElementById("app")
                .style.display = "none"

            document.getElementById("login-screen")
                .style.display = "flex"

        }

        function acesso(usuario) {

            if (!usuario || !usuario.logado) {
                return "Faça login"
            }

            if (usuario.bloqueado) {
                return "Conta bloqueada"
            }

            if (usuario.role === "admin") {
                return "Acesso total"
            }

            if (usuario.plano === "premium") {
                return "Acesso premium"
            }

            return "Acesso básico"

        }

        // =========================
        // BUSCA
        // =========================

        function buscar(valor) {

            estado.busca = valor.toLowerCase()

            render()

        }

        // =========================
        // CARRINHO
        // =========================

        function adicionarCarrinho(id) {

            if (!estado.usuario) {

                alert("Faça login")

                return

            }

            let produto = null

            for (let i = 0; i < estado.produtos.length; i++) {

                if (estado.produtos[i].id === id) {

                    produto = estado.produtos[i]

                }

            }

            if (!produto) {

                alert("Produto não encontrado")

                return

            }

            if (produto.estoque <= 0) {

                alert("Produto sem estoque")

                return

            }

            let produtoExiste = false

            for (let i = 0; i < estado.carrinho.length; i++) {

                if (estado.carrinho[i].id === id) {

                    if (
                        estado.carrinho[i].quantidade >=
                        produto.estoque
                    ) {

                        alert("Estoque máximo atingido")

                        return

                    }

                    estado.carrinho[i].quantidade++

                    produtoExiste = true

                }

            }

            if (!produtoExiste) {

                estado.carrinho.push({

                    id: produto.id,
                    nome: produto.nome,
                    preco: produto.preco,
                    quantidade: 1

                })

            }

            estado.historico.push(
                "ADD " + produto.nome
            )

            render()

        }

        function removerCarrinho(id) {

            let novoCarrinho = []

            for (let i = 0; i < estado.carrinho.length; i++) {

                if (estado.carrinho[i].id !== id) {

                    novoCarrinho.push(
                        estado.carrinho[i]
                    )

                }

            }

            estado.carrinho = novoCarrinho

            // estado.historico.push(
            //     "REMOVE " + id
            // )

            render()

        }

        // =========================
        // TOTAL
        // =========================

        function calcularTotal(valor, vip, cupom) {

            let desconto = 0

            if (valor > 200) {
                desconto += 15
            }

            if (vip) {
                desconto += 10
            }

            if (cupom) {
                desconto += 5
            }

            if (desconto > 25) {
                desconto = 25
            }

            return valor - (valor * desconto / 100)

        }

        function totalCarrinho() {

            let valor = 0

            for (let i = 0; i < estado.carrinho.length; i++) {

                valor +=
                    estado.carrinho[i].preco *
                    estado.carrinho[i].quantidade

            }

            let cupom =
                document.getElementById("cupom").value

            let cupomAtivo = false

            if (cupom === "DEV10") {
                cupomAtivo = true
            }

            let vip = false

            if (
                estado.usuario &&
                estado.usuario.plano === "premium"
            ) {

                vip = true

            }

            return calcularTotal(
                valor,
                vip,
                cupomAtivo
            )

        }

        // =========================
        // PEDIDO
        // =========================

        function finalizarPedido() {

            let nome =
                document.getElementById("nome").value

            let endereco =
                document.getElementById("endereco").value

            let cartao =
                document.getElementById("cartao").value

            if (!nome || !endereco || !cartao) {

                alert("Preencha todos os campos")

                return

            }

            if (estado.carrinho.length === 0) {

                alert("Carrinho vazio")

                return

            }

            for (let i = 0; i < estado.carrinho.length; i++) {

                let item = estado.carrinho[i]

                for (let j = 0; j < estado.produtos.length; j++) {

                    if (
                        estado.produtos[j].id === item.id
                    ) {

                        estado.produtos[j].estoque -=
                            item.quantidade

                    }

                }

            }

            estado.pedidos.push({

                itens: estado.carrinho,

                total: totalCarrinho(),

                data: new Date()

            })

            estado.carrinho = []

            document.getElementById("nome").value = ""
            document.getElementById("endereco").value = ""
            document.getElementById("cartao").value = ""
            document.getElementById("cupom").value = ""

            alert("Pedido realizado!")

            fecharCheckout()

            render()

        }

        // =========================
        // RENDER
        // =========================

        function renderProdutos() {

            let container =
                document.getElementById("produtos")

            container.innerHTML = ""

            for (let i = 0; i < estado.produtos.length; i++) {

                let produto = estado.produtos[i]

                let nomeProduto =
                    produto.nome.toLowerCase()

                if (
                    nomeProduto.includes(estado.busca)
                ) {

                    container.innerHTML += `

                        <div class="card">

                            <h3>${produto.nome}</h3>

                            <p>
                                Preço:
                                R$ ${produto.preco}
                            </p>

                            <p>
                                Estoque:
                                ${produto.estoque}
                            </p>

                            <button
                                onclick="adicionarCarrinho(${produto.id})">

                                Comprar

                            </button>

                        </div>

                    `

                }

            }

        }

        function renderCarrinho() {

            let container =
                document.getElementById("lista-carrinho")

            container.innerHTML = ""

            let quantidadeTotal = 0

            for (let i = 0; i < estado.carrinho.length; i++) {

                let item = estado.carrinho[i]

                quantidadeTotal += item.quantidade

                container.innerHTML += `

                    <div style="margin-bottom:10px;">

                        ${item.nome}
                        x${item.quantidade}

                        <button
                            onclick="removerCarrinho(${item.id})">

                            X

                        </button>

                    </div>

                `

            }

            document.getElementById("qtd-carrinho")
                .innerText = quantidadeTotal


            document.getElementById("total")
                .innerText =
                "Total: R$ " +
                totalCarrinho().toFixed(2)
                

        }

        function render() {

            document.getElementById("status")
                .innerText =
                acesso(estado.usuario)

            renderProdutos()

            renderCarrinho()

        }

        // =========================
        // MODAIS
        // =========================


        function abrirCarrinho() {

            document.getElementById("modal-carrinho").style.display = "flex"

        }


        function fecharCarrinho() {

            document.getElementById("modal-carrinho").style.display = "none"

        }

        function abrirCheckout() {

            if (estado.carrinho.length === 0) {

                alert("Carrinho vazio")

                return

            }

            fecharCarrinho()

            document.getElementById("modal-checkout")
                .style.display = "flex"

        }

        function fecharCheckout() {

            document.getElementById("modal-checkout")
                .style.display = "none"

        }

    </script>

</body>

</html>
